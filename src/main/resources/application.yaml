spring:
  application:
    name: spring-db-benchmark
  datasource:
    url: jdbc:postgresql://localhost:5432/benchmark_db
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
      auto-commit: true
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
        generate_statistics: false
    open-in-view: false
  flyway:
    enabled: true

benchmark:
  seed:
    size: 100000
